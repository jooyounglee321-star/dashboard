<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    header h1 { font-size: 1.6rem; font-weight: 700; }
    header a {
      font-size: 0.85rem;
      color: #4f6ef7;
      text-decoration: none;
      border: 1px solid #4f6ef7;
      padding: 5px 14px;
      border-radius: 6px;
    }
    header a:hover { background: #4f6ef7; color: #fff; }

    /* ── Grand Total Banner ── */
    .grand-total-banner {
      background: linear-gradient(135deg, #4f6ef7 0%, #7b5ea7 100%);
      color: #fff;
      border-radius: 14px;
      padding: 20px 28px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .grand-total-banner .label { font-size: 1rem; opacity: .85; }
    .grand-total-banner .value { font-size: 2rem; font-weight: 700; }

    /* ── Category Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
    }
    .card-header .cat-name { font-weight: 700; font-size: 1rem; }
    .card-header .cat-total {
      font-size: 0.95rem;
      font-weight: 600;
      color: #4f6ef7;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    thead th {
      background: #fafafa;
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      color: #666;
      border-bottom: 1px solid #eee;
    }
    thead th.num { text-align: right; }
    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid #f5f5f5;
    }
    tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }

    tfoot td {
      padding: 10px 14px;
      font-weight: 700;
      background: #f8f9ff;
      border-top: 2px solid #e8ecff;
    }
    tfoot td.num { text-align: right; color: #4f6ef7; }

    .empty {
      padding: 20px;
      text-align: center;
      color: #aaa;
      font-size: 0.85rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      margin-left: 6px;
    }
    .badge-robinhood { background: #fff0e6; color: #d4631a; }
    .badge-us        { background: #e6f0ff; color: #2a5ad4; }
    .badge-kor-stock { background: #e6fff0; color: #1a9450; }
    .badge-kor-etf   { background: #f3e6ff; color: #7b2fd4; }
  </style>
</head>
<body>

<header>
  <h1>📊 보유주식 현황</h1>
  <a href="/admin.html">⚙️ 관리</a>
</header>

<div class="grand-total-banner">
  <div>
    <div class="label">전체 평가금액 합계</div>
    <div class="value" id="grand-total">—</div>
  </div>
  <div id="grand-count" style="opacity:.75;font-size:.9rem;"></div>
</div>

<div class="grid" id="categories-grid">
  <!-- 카테고리 카드가 여기에 렌더링됩니다 -->
</div>

<script>
  const CATEGORIES = [
    { key: "robinhood", label: "Robinhood",  badge: "badge-robinhood" },
    { key: "us",        label: "US",         badge: "badge-us" },
    { key: "kor-stock", label: "KOR Stock",  badge: "badge-kor-stock" },
    { key: "kor-etf",   label: "KOR ETF",    badge: "badge-kor-etf" },
  ];

  const fmt = (n) => Number(n).toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  async function load() {
    const [stocksRes, summaryRes] = await Promise.all([
      fetch('/api/stocks'),
      fetch('/api/stocks/summary'),
    ]);
    const stocks  = await stocksRes.json();
    const summary = await summaryRes.json();

    // 전체 합계 배너
    document.getElementById('grand-total').textContent = fmt(summary.grand_total);
    const totalCount = Object.values(summary.categories).reduce((a, c) => a + c.count, 0);
    document.getElementById('grand-count').textContent = `총 ${totalCount}개 종목`;

    // 카테고리 카드 렌더링
    const grid = document.getElementById('categories-grid');
    grid.innerHTML = '';

    for (const cat of CATEGORIES) {
      const info      = summary.categories[cat.key] || { label: cat.label, count: 0, total: 0 };
      const catStocks = stocks.filter(s => s.category === cat.key);
      catStocks.sort((a, b) => a.ticker.localeCompare(b.ticker));

      const rows = catStocks.length
        ? catStocks.map(s => {
            const total = (s.quantity || 0) * (s.avg_price || 0);
            return `<tr>
              <td><strong>${s.ticker}</strong></td>
              <td>${s.name || '—'}</td>
              <td class="num">${s.quantity != null ? fmt(s.quantity) : '—'}</td>
              <td class="num">${s.avg_price != null ? fmt(s.avg_price) : '—'}</td>
              <td class="num">${fmt(total)}</td>
            </tr>`;
          }).join('')
        : `<tr><td colspan="5" class="empty">종목이 없습니다</td></tr>`;

      grid.insertAdjacentHTML('beforeend', `
        <div class="card">
          <div class="card-header">
            <span class="cat-name">
              ${cat.label}
              <span class="badge ${cat.badge}">${info.count}개</span>
            </span>
            <span class="cat-total">${fmt(info.total)}</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>티커</th>
                <th>종목명</th>
                <th class="num">수량</th>
                <th class="num">평균단가</th>
                <th class="num">평가금액</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
            ${catStocks.length ? `
            <tfoot>
              <tr>
                <td colspan="4">소계</td>
                <td class="num">${fmt(info.total)}</td>
              </tr>
            </tfoot>` : ''}
          </table>
        </div>
      `);
    }
  }

  load();
</script>
</body>
</html>
