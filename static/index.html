<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보유주식 현황</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-refresh {
      background: none;
      border: 1.5px solid #4f6ef7;
      color: #4f6ef7;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-refresh:hover { background: #4f6ef7; color: #fff; }
    .btn-admin {
      background: #4f6ef7;
      color: #fff;
      border: none;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-admin:hover { opacity: .88; }

    /* ── Grand Total Banner ── */
    .banner {
      background: linear-gradient(135deg, #4f6ef7 0%, #7b5ea7 100%);
      color: #fff;
      border-radius: 16px;
      padding: 22px 28px;
      margin-bottom: 24px;
      display: flex;
      gap: 40px;
      align-items: center;
    }
    .banner-item .label { font-size: 0.8rem; opacity: .8; margin-bottom: 4px; }
    .banner-item .value { font-size: 1.8rem; font-weight: 700; }
    .banner-item .value.up   { color: #6effa0; }
    .banner-item .value.down { color: #ff8080; }
    .banner-item .value.flat { color: #ccc; }

    /* ── Category Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      overflow: hidden;
    }

    .card-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
    }
    .card-header .cat-left { display: flex; align-items: center; gap: 8px; }
    .cat-name { font-weight: 700; font-size: 1rem; }
    .cat-count {
      font-size: 0.72rem; font-weight: 600;
      background: #f0f2f5; color: #666;
      padding: 2px 8px; border-radius: 20px;
    }
    .cat-total { font-size: 0.95rem; font-weight: 700; color: #4f6ef7; }
    .cat-change { font-size: 0.82rem; font-weight: 600; margin-left: 8px; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    thead th {
      background: #fafafa;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      color: #888;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }
    thead th.r { text-align: right; }
    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid #f5f5f5;
      vertical-align: middle;
    }
    tbody td.r { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }

    tfoot td {
      padding: 9px 12px;
      font-weight: 700;
      background: #f8f9ff;
      border-top: 2px solid #e8ecff;
    }
    tfoot td.r { text-align: right; color: #4f6ef7; }

    /* ── Price States ── */
    .up   { color: #16a34a; }
    .down { color: #dc2626; }
    .flat { color: #94a3b8; }

    .ticker { font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace; }
    .name   { color: #555; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Loading Spinner ── */
    .spin {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #ccc;
      border-top-color: #4f6ef7;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-row td {
      text-align: center;
      color: #bbb;
      padding: 20px;
      font-size: 0.85rem;
    }

    /* ── Updated time ── */
    .updated-at {
      text-align: right;
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 16px;
    }

    .badge-robinhood { background:#fff0e6; color:#d4631a; padding:2px 8px; border-radius:12px; font-size:.7rem; font-weight:700; }
    .badge-us        { background:#e6f0ff; color:#2a5ad4; padding:2px 8px; border-radius:12px; font-size:.7rem; font-weight:700; }
    .badge-kor-stock { background:#e6fff0; color:#1a9450; padding:2px 8px; border-radius:12px; font-size:.7rem; font-weight:700; }
    .badge-kor-etf   { background:#f3e6ff; color:#7b2fd4; padding:2px 8px; border-radius:12px; font-size:.7rem; font-weight:700; }
  </style>
</head>
<body>

<header>
  <h1>📊 보유주식 현황</h1>
  <div class="header-right">
    <button class="btn-refresh" onclick="loadAll()">↻ 새로고침</button>
    <a class="btn-admin" href="/admin.html">⚙ 관리</a>
  </div>
</header>

<!-- Grand Total Banner -->
<div class="banner">
  <div class="banner-item">
    <div class="label">전체 평가금액</div>
    <div class="value" id="b-total">—</div>
  </div>
  <div class="banner-item">
    <div class="label">당일 손익</div>
    <div class="value" id="b-change">—</div>
  </div>
  <div class="banner-item">
    <div class="label">등락률</div>
    <div class="value" id="b-pct">—</div>
  </div>
  <div class="banner-item">
    <div class="label">총 종목 수</div>
    <div class="value" id="b-count" style="font-size:1.3rem;">—</div>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="updated-at" id="updated-at"></div>

<script>
const CATS = [
  { key: "robinhood", label: "Robinhood", badge: "badge-robinhood" },
  { key: "us",        label: "US",        badge: "badge-us" },
  { key: "kor-stock", label: "KOR Stock", badge: "badge-kor-stock" },
  { key: "kor-etf",   label: "KOR ETF",   badge: "badge-kor-etf" },
];

// 통화별 포맷
function fmtPrice(val, currency) {
  if (val == null) return "—";
  if (currency === "KRW") {
    return "₩" + Math.round(val).toLocaleString("ko-KR");
  }
  return "$" + Number(val).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 4 });
}
function fmtUSD(val) {
  if (val == null) return "—";
  return "$" + Number(val).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtKRW(val) {
  return "₩" + Math.round(val).toLocaleString("ko-KR");
}
function fmtPct(val) {
  if (val == null) return "—";
  const sign = val > 0 ? "+" : "";
  return sign + Number(val).toFixed(2) + "%";
}
function cls(val) {
  if (val == null || val === 0) return "flat";
  return val > 0 ? "up" : "down";
}
function arrow(val) {
  if (!val || val === 0) return "";
  return val > 0 ? "▲ " : "▼ ";
}

async function loadAll() {
  const grid = document.getElementById("grid");
  grid.innerHTML = CATS.map(c => `
    <div class="card" id="card-${c.key}">
      <div class="card-header">
        <div class="cat-left">
          <span class="cat-name">${c.label}</span>
          <span class="cat-count" id="cnt-${c.key}">0/10</span>
        </div>
        <span><span class="cat-total" id="tot-${c.key}">—</span>
              <span class="cat-change" id="chg-${c.key}"></span></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>티커</th><th>종목명</th><th class="r">수량</th>
            <th class="r">현재가</th><th class="r">전날종가</th>
            <th class="r">등락금액</th><th class="r">등락률</th><th class="r">평가금액</th>
          </tr>
        </thead>
        <tbody id="tb-${c.key}"><tr><td colspan="8" class="empty-row" style="text-align:center;padding:20px;color:#bbb;"><span class="spin"></span> 로딩 중…</td></tr></tbody>
        <tfoot id="tf-${c.key}"></tfoot>
      </table>
    </div>`).join("");

  // 1) 종목 목록 로드
  const stocks = await fetch("/api/stocks").then(r => r.json()).catch(() => []);

  // 2) 유니크 티커 → 가격 병렬 조회
  const tickers = [...new Set(stocks.map(s => s.ticker))];
  const priceMap = {};
  await Promise.allSettled(
    tickers.map(async t => {
      try {
        const p = await fetch(`/api/stocks/price/${encodeURIComponent(t)}`).then(r => r.json());
        priceMap[t] = p;
      } catch { /* 가격 없음 */ }
    })
  );

  // 3) 카테고리별 렌더링
  let grandTotal = 0, grandChange = 0, grandPrevTotal = 0, grandCount = 0;

  for (const cat of CATS) {
    const catStocks = stocks.filter(s => s.category === cat.key);
    grandCount += catStocks.length;

    document.getElementById(`cnt-${cat.key}`).textContent = `${catStocks.length}/10`;

    let catTotal = 0, catChange = 0, catPrevTotal = 0;

    const rows = catStocks.length ? catStocks.map(s => {
      const p   = priceMap[s.ticker];
      const qty = s.quantity || 0;
      const cur = p?.current_price;
      const pre = p?.prev_close;
      const chA = p?.change_amount;
      const chP = p?.change_percent;
      const cur2 = cur ?? Number(s.avg_price ?? 0);
      const pre2 = pre ?? Number(s.avg_price ?? 0);
      const val  = qty * cur2;
      const valPrev = qty * pre2;
      const rowChange = cur != null ? (chA * qty) : 0;

      catTotal    += val;
      catPrevTotal += valPrev;
      catChange   += rowChange;

      const currency = p?.currency || "USD";
      const fmtV = v => fmtPrice(v, currency);
      const chAmtStr = cur != null ? `<span class="${cls(chA)}">${arrow(chA)}${fmtV(Math.abs(chA))}</span>` : "—";
      const chPctStr = cur != null ? `<span class="${cls(chP)}">${fmtPct(chP)}</span>` : "—";
      const curStr   = cur != null ? fmtV(cur) : `<span class="flat">${fmtV(s.avg_price)} <small>(단가)</small></span>`;
      const preStr   = pre != null ? fmtV(pre) : "—";

      return `<tr>
        <td><span class="ticker">${s.ticker}</span></td>
        <td><span class="name" title="${s.name||''}">${s.name || "—"}</span></td>
        <td class="r">${qty.toLocaleString()}</td>
        <td class="r">${curStr}</td>
        <td class="r">${preStr}</td>
        <td class="r">${chAmtStr}</td>
        <td class="r">${chPctStr}</td>
        <td class="r"><strong>${fmtUSD(val)}</strong></td>
      </tr>`;
    }).join("") : `<tr class="empty-row"><td colspan="8">종목이 없습니다</td></tr>`;

    document.getElementById(`tb-${cat.key}`).innerHTML = rows;

    if (catStocks.length) {
      const catPct = catPrevTotal ? ((catTotal - catPrevTotal) / catPrevTotal * 100) : 0;
      document.getElementById(`tot-${cat.key}`).textContent = fmtUSD(catTotal);
      document.getElementById(`chg-${cat.key}`).innerHTML =
        `<span class="${cls(catChange)}">${catChange >= 0 ? "+" : ""}${fmtUSD(catChange)} (${fmtPct(catPct)})</span>`;
      document.getElementById(`tf-${cat.key}`).innerHTML =
        `<tr><td colspan="7" class="r" style="font-weight:700;">소계 (${catStocks.length}개)</td><td class="r">${fmtUSD(catTotal)}</td></tr>`;
    } else {
      document.getElementById(`tf-${cat.key}`).innerHTML = "";
    }

    grandTotal    += catTotal;
    grandChange   += catChange;
    grandPrevTotal += catPrevTotal;
  }

  // 4) 배너 업데이트
  const grandPct = grandPrevTotal ? ((grandTotal - grandPrevTotal) / grandPrevTotal * 100) : 0;
  document.getElementById("b-total").textContent  = fmtUSD(grandTotal);
  document.getElementById("b-change").className   = "value " + cls(grandChange);
  document.getElementById("b-change").textContent = (grandChange >= 0 ? "+" : "") + fmtUSD(grandChange);
  document.getElementById("b-pct").className      = "value " + cls(grandPct);
  document.getElementById("b-pct").textContent    = fmtPct(grandPct);
  document.getElementById("b-count").textContent  = grandCount + "개";

  document.getElementById("updated-at").textContent =
    "⏱ 마지막 업데이트: " + new Date().toLocaleTimeString("ko-KR");
}

loadAll();
</script>
</body>
</html>
