<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>회원관리 — 어드민</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--card:#fffef9;--card2:#faf7f0;
  --ink:#2c2416;--ink2:#6b5e4a;--ink3:#a89880;
  --accent:#c4662a;--accent2:#e8a060;
  --border:rgba(100,80,50,0.15);--shadow:0 2px 12px rgba(100,70,30,0.08);
  --green:#4a7c59;--blue:#3a6b8a;--red:#c0392b;
}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-weight:300;min-height:100vh;}

/* ── Header ── */
.header{background:var(--ink);color:#f5f0e8;padding:0.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--accent2);}
.header-nav{display:flex;gap:0.5rem;flex-wrap:wrap;}
.nav-link{font-size:0.78rem;color:var(--accent2);text-decoration:none;border:1px solid rgba(232,160,96,0.35);padding:0.28rem 0.7rem;border-radius:20px;transition:all 0.15s;}
.nav-link:hover,.nav-link.active{border-color:var(--accent2);background:rgba(232,160,96,0.12);}

/* ── 본문 ── */
.main{max-width:1080px;margin:0 auto;padding:1.5rem 1.2rem;}

/* ── 요약 칩 ── */
.summary-bar{display:flex;gap:0.75rem;margin-bottom:1.3rem;flex-wrap:wrap;}
.chip{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:0.75rem 1.2rem;min-width:120px;}
.chip-label{font-size:0.67rem;color:var(--ink3);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:0.25rem;}
.chip-value{font-size:1.4rem;font-weight:700;color:var(--ink);}
.chip-value.accent{color:var(--accent);}

/* ── 메인 카드 ── */
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;}
.card-top{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 1.2rem;border-bottom:1px solid var(--border);background:var(--card2);flex-wrap:wrap;gap:0.6rem;}
.card-title-txt{font-size:0.72rem;font-weight:500;letter-spacing:0.1em;color:var(--ink3);text-transform:uppercase;}

/* ── 필터 바 ── */
.filter-bar{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;}
.filter-bar input{
  padding:0.35rem 0.75rem;font-size:0.8rem;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--ink);font-family:inherit;
  width:190px;transition:border-color 0.15s;
}
.filter-bar input:focus{outline:none;border-color:var(--accent);}
.filter-bar select{
  padding:0.35rem 0.6rem;font-size:0.8rem;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--ink);font-family:inherit;
}
.btn-refresh{
  padding:0.35rem 0.85rem;font-size:0.78rem;cursor:pointer;
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  font-family:inherit;font-weight:500;transition:background 0.15s;white-space:nowrap;
}
.btn-refresh:hover{background:#a8551f;}

/* ── 테이블 ── */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:0.85rem;}
thead tr{background:var(--card2);}
th{
  padding:0.65rem 1.1rem;text-align:left;
  font-size:0.68rem;font-weight:500;letter-spacing:0.07em;
  color:var(--ink3);text-transform:uppercase;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:0.65rem 1.1rem;border-bottom:1px solid var(--border);color:var(--ink2);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--card2);}

/* ── 뱃지 ── */
.badge{display:inline-flex;align-items:center;gap:0.3rem;font-size:0.7rem;font-weight:500;padding:0.15rem 0.6rem;border-radius:20px;white-space:nowrap;}
/* 역할 */
.badge-Admin  {background:#ffd5c0;color:#7a2a00;}
.badge-Member {background:#c0edd8;color:#0d4a2a;}
/* 가입경로 */
.badge-local    {background:#ede8e0;color:#6b5e4a;}
.badge-google   {background:#fce8e6;color:#c5221f;}
.badge-facebook {background:#dce8ff;color:#1a3d7c;}

/* 가입경로 아이콘 */
.provider-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot-local   {background:#a89880;}
.dot-google  {background:#ea4335;}
.dot-facebook{background:#1877f2;}

/* ── 빈 상태 / 로딩 ── */
.state-row td{text-align:center;padding:2.5rem;color:var(--ink3);font-size:0.85rem;font-style:italic;}

/* ── 페이지네이션 ── */
.pagination{
  display:flex;align-items:center;justify-content:flex-end;gap:0.4rem;
  padding:0.75rem 1.1rem;border-top:1px solid var(--border);background:var(--card2);
  flex-wrap:wrap;
}
.page-info{font-size:0.78rem;color:var(--ink3);margin-right:0.3rem;}
.page-btn{
  padding:0.28rem 0.7rem;font-size:0.78rem;cursor:pointer;
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  color:var(--ink2);font-family:inherit;transition:all 0.15s;
}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.page-btn:disabled{opacity:0.4;cursor:not-allowed;}
</style>
</head>
<body>

<header class="header">
  <div class="header-title">어드민 — 회원관리</div>
  <nav class="header-nav">
    <a href="/admin" class="nav-link">대시보드 설정</a>
    <a href="/admin_users" class="nav-link active">회원관리</a>
    <a href="/" class="nav-link">홈으로</a>
  </nav>
</header>

<div class="main">

  <!-- 요약 칩 -->
  <div class="summary-bar">
    <div class="chip">
      <div class="chip-label">전체 회원</div>
      <div class="chip-value" id="cnt-total">—</div>
    </div>
    <div class="chip">
      <div class="chip-label">이메일 가입</div>
      <div class="chip-value" id="cnt-local">—</div>
    </div>
    <div class="chip">
      <div class="chip-label">구글</div>
      <div class="chip-value accent" id="cnt-google">—</div>
    </div>
    <div class="chip">
      <div class="chip-label">페이스북</div>
      <div class="chip-value" id="cnt-facebook">—</div>
    </div>
    <div class="chip">
      <div class="chip-label">관리자</div>
      <div class="chip-value" id="cnt-admin">—</div>
    </div>
  </div>

  <!-- 회원 테이블 카드 -->
  <div class="card">
    <div class="card-top">
      <span class="card-title-txt">가입 회원 목록</span>
      <div class="filter-bar">
        <input type="text" id="search-input" placeholder="이메일 검색…">
        <select id="role-filter">
          <option value="">전체 역할</option>
          <option value="Admin">Admin</option>
          <option value="Member">Member</option>
        </select>
        <select id="provider-filter">
          <option value="">전체 가입경로</option>
          <option value="local">이메일</option>
          <option value="google">구글</option>
          <option value="facebook">페이스북</option>
        </select>
        <button class="btn-refresh" onclick="loadUsers()">새로고침</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>이메일</th>
            <th>역할</th>
            <th>가입경로</th>
            <th>가입일</th>
          </tr>
        </thead>
        <tbody id="user-tbody">
          <tr class="state-row"><td colspan="5">불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info" id="page-info"></span>
      <button class="page-btn" id="btn-prev" onclick="changePage(-1)" disabled>← 이전</button>
      <button class="page-btn" id="btn-next" onclick="changePage(1)"  disabled>다음 →</button>
    </div>
  </div>

</div><!-- /main -->

<script>
const PAGE_SIZE = 20;
let allUsers = [], filtered = [], currentPage = 1;

/* ── 데이터 로드 ── */
async function loadUsers() {
  document.getElementById('user-tbody').innerHTML =
    '<tr class="state-row"><td colspan="5">불러오는 중…</td></tr>';
  try {
    const res = await fetch('/api/auth/users');
    allUsers  = res.ok ? await res.json() : [];
  } catch { allUsers = []; }
  applyFilter();
}

/* ── 필터 적용 ── */
function applyFilter() {
  const kw       = document.getElementById('search-input').value.trim().toLowerCase();
  const role     = document.getElementById('role-filter').value;
  const provider = document.getElementById('provider-filter').value;

  filtered = allUsers.filter(u =>
    (!kw       || u.email.toLowerCase().includes(kw)) &&
    (!role     || u.role     === role) &&
    (!provider || u.provider === provider)
  );
  currentPage = 1;
  renderSummary();
  renderTable();
}

/* ── 요약 칩 ── */
function renderSummary() {
  const count = (key, val) => allUsers.filter(u => u[key] === val).length;
  document.getElementById('cnt-total').textContent    = allUsers.length;
  document.getElementById('cnt-local').textContent    = count('provider','local');
  document.getElementById('cnt-google').textContent   = count('provider','google');
  document.getElementById('cnt-facebook').textContent = count('provider','facebook');
  document.getElementById('cnt-admin').textContent    = count('role','Admin');
}

/* ── 테이블 렌더 ── */
function renderTable() {
  const tbody = document.getElementById('user-tbody');
  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = filtered.slice(start, start + PAGE_SIZE);

  if (!page.length) {
    tbody.innerHTML = '<tr class="state-row"><td colspan="5">가입된 회원이 없습니다.</td></tr>';
    document.getElementById('page-info').textContent = '';
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = true;
    return;
  }

  tbody.innerHTML = page.map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${esc(u.email)}</td>
      <td><span class="badge badge-${esc(u.role)}">${esc(u.role)}</span></td>
      <td>${providerBadge(u.provider)}</td>
      <td>${fmtDate(u.created_at)}</td>
    </tr>`).join('');

  const total = filtered.length;
  const pages = Math.ceil(total / PAGE_SIZE);
  document.getElementById('page-info').textContent =
    `${start + 1}–${Math.min(start + PAGE_SIZE, total)} / ${total}명`;
  document.getElementById('btn-prev').disabled = currentPage <= 1;
  document.getElementById('btn-next').disabled = currentPage >= pages;
}

function providerBadge(p) {
  const labels = { local:'이메일', google:'구글', facebook:'페이스북' };
  const label  = labels[p] || esc(p);
  return `<span class="badge badge-${esc(p)}">
    <span class="provider-dot dot-${esc(p)}"></span>${label}</span>`;
}

function changePage(dir) { currentPage += dir; renderTable(); }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── 이벤트 ── */
document.getElementById('search-input').addEventListener('input', applyFilter);
document.getElementById('role-filter').addEventListener('change', applyFilter);
document.getElementById('provider-filter').addEventListener('change', applyFilter);

loadUsers();
</script>
</body>
</html>
