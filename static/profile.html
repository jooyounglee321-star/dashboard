<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 🔒 Navigation Guard -->
<style>body{visibility:hidden}</style>
<script>
(function(){
  var token = localStorage.getItem('token');
  var hasToken = token && token.trim() !== '' && token !== 'undefined' && token !== 'null';
  if (!hasToken) { window.location.replace('/login'); return; }
  document.addEventListener('DOMContentLoaded', function(){ document.body.style.visibility = 'visible'; });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>내 프로필 — 나의 하루 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--card:#fffef9;--card2:#faf7f0;
  --ink:#2c2416;--ink2:#6b5e4a;--ink3:#a89880;
  --accent:#c4662a;--accent2:#e8a060;
  --border:rgba(100,80,50,0.15);--shadow:0 4px 24px rgba(100,70,30,0.10);
  --green:#4a7c59;--red:#c0392b;
}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;font-weight:300;
  min-height:100vh;display:flex;flex-direction:column;
}

/* ── Header ── */
.header{
  background:var(--ink);padding:0.9rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
}
.header-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--accent2);text-decoration:none;}
.header-right{display:flex;align-items:center;gap:0.7rem;}
.back-btn{
  font-size:0.78rem;color:var(--accent2);text-decoration:none;
  border:1px solid rgba(232,160,96,0.4);padding:0.28rem 0.7rem;border-radius:20px;
  transition:border-color 0.15s;
}
.back-btn:hover{border-color:var(--accent2);}

/* ── 레이아웃 ── */
.page-wrap{
  flex:1;display:flex;justify-content:center;
  padding:2rem 1rem 3rem;
}
.profile-card{
  background:var(--card);border-radius:18px;border:1px solid var(--border);
  box-shadow:var(--shadow);padding:2.2rem 2.4rem;
  width:100%;max-width:500px;
}

/* ── 아바타 섹션 ── */
.avatar-section{display:flex;flex-direction:column;align-items:center;margin-bottom:2rem;}
.avatar-wrap{
  position:relative;width:88px;height:88px;margin-bottom:0.7rem;cursor:pointer;
}
.avatar-img{
  width:88px;height:88px;border-radius:50%;
  background:var(--card2);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;overflow:hidden;object-fit:cover;
}
.avatar-img img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar-overlay{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(44,36,22,0.45);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.18s;font-size:1.2rem;color:#fff;
}
.avatar-wrap:hover .avatar-overlay{opacity:1;}
.avatar-hint{font-size:0.72rem;color:var(--ink3);}
#avatar-input{display:none;}

/* ── 섹션 구분 ── */
.section-eyebrow{
  font-size:0.68rem;font-weight:500;letter-spacing:0.12em;
  color:var(--accent);text-transform:uppercase;margin-bottom:1rem;margin-top:1.8rem;
  padding-bottom:0.4rem;border-bottom:1px solid var(--border);
}
.section-eyebrow:first-of-type{margin-top:0;}

/* ── 폼 필드 ── */
.field{margin-bottom:1rem;}
.field label{
  display:block;font-size:0.8rem;font-weight:500;
  color:var(--ink2);margin-bottom:0.35rem;
}
.field input{
  width:100%;padding:0.62rem 0.85rem;
  border:1.5px solid var(--border);border-radius:9px;
  font-size:0.9rem;font-family:inherit;font-weight:300;
  color:var(--ink);background:var(--card2);
  outline:none;transition:border-color 0.15s;
}
.field input:focus{border-color:var(--accent);}
.field input:disabled{
  background:var(--bg);color:var(--ink3);cursor:not-allowed;
  border-color:transparent;
}
.field-hint{font-size:0.73rem;color:var(--ink3);margin-top:0.3rem;}

/* ── 비밀번호 눈 토글 ── */
.pw-wrap{position:relative;display:flex;align-items:center;}
.pw-wrap input{flex:1;padding-right:2.6rem;}
.btn-eye{
  position:absolute;right:0.75rem;background:none;border:none;
  cursor:pointer;font-size:1rem;color:var(--ink3);padding:0.2rem;line-height:1;
}
.btn-eye:hover{color:var(--ink2);}

/* ── 정보 행 (읽기 전용) ── */
.info-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.6rem 0;border-bottom:1px solid var(--border);
  font-size:0.88rem;
}
.info-row:last-child{border-bottom:none;}
.info-label{color:var(--ink3);font-size:0.8rem;}
.info-value{color:var(--ink);font-weight:400;}
.plan-badge{
  display:inline-block;
  padding:0.18rem 0.65rem;border-radius:20px;
  font-size:0.72rem;font-weight:500;letter-spacing:0.03em;
}
.plan-free{background:#e8e0d4;color:var(--ink2);}
.plan-premium{background:#fff3e0;color:#b56000;border:1px solid #f0c060;}

/* ── 버튼 ── */
.btn-save{
  width:100%;padding:0.78rem;font-size:0.95rem;font-weight:500;
  cursor:pointer;background:var(--accent);color:#fff;
  border:none;border-radius:10px;font-family:inherit;
  margin-top:1.6rem;transition:background 0.15s,transform 0.1s;letter-spacing:0.02em;
}
.btn-save:hover{background:#a8551f;transform:translateY(-1px);}
.btn-save:active{transform:translateY(0);}
.btn-save:disabled{background:var(--ink3);cursor:not-allowed;transform:none;}

/* ── 메시지 ── */
.msg{
  font-size:0.82rem;margin-top:0.9rem;padding:0.6rem 0.9rem;
  border-radius:8px;display:none;line-height:1.5;
}
.msg.success{background:#e8f5ec;color:var(--green);border:1px solid #a8d5b5;display:block;}
.msg.error  {background:#fdecea;color:var(--red);  border:1px solid #f0b0aa;display:block;}

@media(max-width:520px){
  .profile-card{padding:1.5rem 1.2rem;}
}
</style>
</head>
<body>

<header class="header">
  <a href="/" class="header-title">✦ 나의 하루</a>
  <div class="header-right">
    <a href="/" class="back-btn">← 대시보드</a>
  </div>
</header>

<div class="page-wrap">
  <div class="profile-card">

    <!-- 아바타 -->
    <div class="avatar-section">
      <div class="avatar-wrap" onclick="document.getElementById('avatar-input').click()" title="프로필 사진 변경">
        <div class="avatar-img" id="avatar-display">
          <span id="avatar-emoji">👤</span>
        </div>
        <div class="avatar-overlay">📷</div>
      </div>
      <span class="avatar-hint">클릭하여 사진 변경</span>
      <input type="file" id="avatar-input" accept="image/*" onchange="onAvatarChange(this)">
    </div>

    <!-- 기본 정보 -->
    <div class="section-eyebrow">기본 정보</div>

    <div class="field">
      <label for="name">닉네임 / 이름</label>
      <input type="text" id="name" placeholder="표시될 이름을 입력하세요" maxlength="50" autocomplete="off">
    </div>

    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" disabled>
      <div class="field-hint">이메일은 변경할 수 없습니다.</div>
    </div>

    <!-- 계정 정보 -->
    <div class="section-eyebrow">계정 정보</div>

    <div class="info-row">
      <span class="info-label">플랜</span>
      <span id="plan-badge" class="plan-badge plan-free">Free</span>
    </div>
    <div class="info-row">
      <span class="info-label">가입일</span>
      <span class="info-value" id="joined-at">—</span>
    </div>

    <!-- 비밀번호 변경 -->
    <div class="section-eyebrow">비밀번호 변경</div>

    <div class="field">
      <label for="current-password">현재 비밀번호</label>
      <div class="pw-wrap">
        <input type="password" id="current-password" placeholder="현재 비밀번호" autocomplete="current-password">
        <button type="button" class="btn-eye" onclick="togglePw('current-password',this)">👁️</button>
      </div>
    </div>
    <div class="field">
      <label for="new-password">새 비밀번호</label>
      <div class="pw-wrap">
        <input type="password" id="new-password" placeholder="8자 이상" autocomplete="new-password">
        <button type="button" class="btn-eye" onclick="togglePw('new-password',this)">👁️</button>
      </div>
    </div>
    <div class="field">
      <label for="confirm-password">새 비밀번호 확인</label>
      <div class="pw-wrap">
        <input type="password" id="confirm-password" placeholder="동일하게 입력" autocomplete="new-password">
        <button type="button" class="btn-eye" onclick="togglePw('confirm-password',this)">👁️</button>
      </div>
    </div>

    <button class="btn-save" id="save-btn" onclick="saveProfile()">저장하기</button>
    <div id="msg" class="msg"></div>

  </div>
</div>

<script>
const token = localStorage.getItem('token');

/* ── 아바타 ── */
function loadAvatar() {
  const saved = localStorage.getItem('avatar_data');
  if (saved) {
    document.getElementById('avatar-emoji').style.display = 'none';
    const img = document.createElement('img');
    img.src = saved;
    document.getElementById('avatar-display').appendChild(img);
  }
}

function onAvatarChange(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showMsg('error', '이미지 크기는 2MB 이하여야 합니다.'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = e.target.result;
    localStorage.setItem('avatar_data', data);
    const el = document.getElementById('avatar-display');
    el.innerHTML = '';
    const img = document.createElement('img');
    img.src = data;
    el.appendChild(img);
    showMsg('success', '프로필 사진이 변경되었습니다. (기기에만 저장)');
  };
  reader.readAsDataURL(file);
}

/* ── 프로필 로드 ── */
async function loadProfile() {
  try {
    const res = await fetch('/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) { if (res.status === 401) window.location.replace('/login'); return; }
    const data = await res.json();

    document.getElementById('name').value = data.name || '';
    document.getElementById('email').value = data.email || '';

    // 플랜 뱃지
    const planBadge = document.getElementById('plan-badge');
    if (data.plan === 'premium') {
      planBadge.textContent = 'Premium';
      planBadge.className = 'plan-badge plan-premium';
    } else {
      planBadge.textContent = 'Free';
      planBadge.className = 'plan-badge plan-free';
    }

    // 가입일
    if (data.created_at) {
      const d = new Date(data.created_at);
      const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
      document.getElementById('joined-at').textContent = `${y}년 ${m}월 ${day}일`;
    }
  } catch {
    showMsg('error', '프로필을 불러오지 못했습니다.');
  }
}

/* ── 저장 ── */
async function saveProfile() {
  clearMsg();
  const name    = document.getElementById('name').value.trim();
  const curPw   = document.getElementById('current-password').value;
  const newPw   = document.getElementById('new-password').value;
  const confPw  = document.getElementById('confirm-password').value;

  // 비밀번호 변경 유효성 검사
  if (newPw) {
    if (newPw.length < 8) { showMsg('error', '새 비밀번호는 8자 이상이어야 합니다.'); return; }
    if (newPw !== confPw) { showMsg('error', '새 비밀번호와 확인 비밀번호가 일치하지 않습니다.'); return; }
    if (!curPw)           { showMsg('error', '현재 비밀번호를 입력해주세요.'); return; }
  }

  const body = { name: name || null };
  if (newPw) { body.current_password = curPw; body.new_password = newPw; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '저장 중…';

  try {
    const res = await fetch('/api/auth/me', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (res.ok) {
      // localStorage user 정보 업데이트
      try {
        const stored = JSON.parse(localStorage.getItem('user') || '{}');
        localStorage.setItem('user', JSON.stringify({ ...stored, name: data.name }));
      } catch {}
      // 비밀번호 변경 시 입력 초기화
      if (newPw) {
        document.getElementById('current-password').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
      }
      showMsg('success', '프로필이 저장되었습니다.');
    } else {
      showMsg('error', data.detail || '저장에 실패했습니다.');
    }
  } catch {
    showMsg('error', '서버 연결에 실패했습니다.');
  } finally {
    btn.disabled = false; btn.textContent = '저장하기';
  }
}

/* ── 유틸 ── */
function togglePw(id, btn) {
  const input = document.getElementById(id);
  const hidden = input.type === 'password';
  input.type = hidden ? 'text' : 'password';
  btn.textContent = hidden ? '🙈' : '👁️';
}
function showMsg(type, text){ const m=document.getElementById('msg'); m.className='msg '+type; m.textContent=text; }
function clearMsg(){ const m=document.getElementById('msg'); m.className='msg'; m.textContent=''; }

loadAvatar();
loadProfile();
</script>
</body>
</html>
