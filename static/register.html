<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>회원가입 — 나의 하루 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--card:#fffef9;--card2:#faf7f0;
  --ink:#2c2416;--ink2:#6b5e4a;--ink3:#a89880;
  --accent:#c4662a;--accent2:#e8a060;
  --border:rgba(100,80,50,0.15);--shadow:0 2px 12px rgba(100,70,30,0.08);
  --green:#4a7c59;--red:#c0392b;
}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column;}

/* ── Header ── */
.header{background:var(--ink);color:#f5f0e8;padding:0.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--accent2);text-decoration:none;}

/* ── 중앙 카드 ── */
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);padding:2.2rem 2rem;width:100%;max-width:400px;}
.card-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--ink);margin-bottom:0.3rem;}
.card-sub{font-size:0.8rem;color:var(--ink3);margin-bottom:1.8rem;}

/* ── 폼 ── */
.field{margin-bottom:1.1rem;}
.field label{display:block;font-size:0.78rem;font-weight:500;color:var(--ink2);margin-bottom:0.35rem;letter-spacing:0.04em;}
.field input{width:100%;padding:0.65rem 0.85rem;font-size:0.9rem;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--ink);font-family:inherit;transition:border-color 0.15s;}
.field input:focus{outline:none;border-color:var(--accent);}

.btn-submit{width:100%;padding:0.75rem;font-size:0.95rem;font-weight:500;cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:9px;font-family:inherit;margin-top:0.5rem;transition:background 0.15s;}
.btn-submit:hover{background:#a8551f;}
.btn-submit:disabled{background:var(--ink3);cursor:not-allowed;}

/* ── 메시지 ── */
.msg{font-size:0.82rem;margin-top:1rem;padding:0.6rem 0.85rem;border-radius:8px;display:none;}
.msg.success{background:#e8f5ec;color:var(--green);border:1px solid #a8d5b5;display:block;}
.msg.error{background:#fdecea;color:var(--red);border:1px solid #f0b0aa;display:block;}

/* ── 로그인 링크 ── */
.login-link{text-align:center;font-size:0.8rem;color:var(--ink3);margin-top:1.2rem;}
.login-link a{color:var(--accent);text-decoration:none;font-weight:500;}
.login-link a:hover{text-decoration:underline;}
</style>
</head>
<body>

<header class="header">
  <a href="/" class="header-title">나의 하루 대시보드</a>
</header>

<div class="center">
  <div class="card">
    <div class="card-title">회원가입</div>
    <div class="card-sub">이메일과 비밀번호를 입력해 계정을 만드세요.</div>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="example@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="8자 이상 입력" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field">
        <label for="password2">비밀번호 확인</label>
        <input type="password" id="password2" placeholder="비밀번호 재입력" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">가입하기</button>
    </form>

    <div id="msg" class="msg"></div>
    <div class="login-link">이미 계정이 있으신가요? <a href="/">로그인</a></div>
  </div>
</div>

<script>
const form = document.getElementById('register-form');
const msg  = document.getElementById('msg');
const btn  = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  msg.textContent = '';

  const email     = document.getElementById('email').value.trim();
  const password  = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if (!email || !password || !password2) {
    showMsg('error', '모든 항목을 입력해주세요.');
    return;
  }
  if (password.length < 8) {
    showMsg('error', '비밀번호는 8자 이상이어야 합니다.');
    return;
  }
  if (password !== password2) {
    showMsg('error', '비밀번호가 일치하지 않습니다.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '처리 중…';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (res.ok) {
      showMsg('success', '가입이 완료되었습니다! 잠시 후 이동합니다.');
      setTimeout(() => { window.location.href = '/'; }, 1800);
    } else {
      showMsg('error', data.detail || '가입에 실패했습니다.');
    }
  } catch (err) {
    showMsg('error', '서버 연결에 실패했습니다.');
  } finally {
    btn.disabled = false;
    btn.textContent = '가입하기';
  }
});

function showMsg(type, text) {
  msg.className = 'msg ' + type;
  msg.textContent = text;
}
</script>
</body>
</html>
