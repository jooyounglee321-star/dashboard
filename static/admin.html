<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주식 관리</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    .back-btn {
      background: none;
      border: 1.5px solid #4f6ef7;
      color: #4f6ef7;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }
    .back-btn:hover { background: #4f6ef7; color: #fff; }

    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }

    /* ── Form ── */
    .form-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      padding: 22px;
      position: sticky;
      top: 24px;
    }
    .form-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 18px; }

    .field { margin-bottom: 13px; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #666;
      margin-bottom: 5px;
    }
    .field input, .field select {
      width: 100%;
      padding: 9px 11px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: #4f6ef7; }

    .cat-quota {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
    }
    .cat-quota.full { color: #dc2626; font-weight: 600; }

    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #4f6ef7; color: #fff; }
    .btn-primary:hover { opacity: .88; }
    .btn-secondary { background: #f0f2f5; color: #555; }
    .btn-secondary:hover { background: #e2e5ec; }

    .hint {
      font-size: 0.74rem;
      color: #999;
      margin-top: 14px;
      line-height: 1.6;
    }

    /* ── Stock List ── */
    .list-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      overflow: hidden;
    }
    .list-header {
      padding: 14px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .list-header h2 { font-size: 1rem; font-weight: 700; }

    .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      background: #f0f2f5;
      color: #666;
      border: 1.5px solid transparent;
    }
    .tab.active { background: #4f6ef7; color: #fff; }

    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    thead th {
      background: #fafafa;
      padding: 9px 14px;
      text-align: left;
      font-weight: 600;
      color: #888;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }
    thead th.r { text-align: right; }
    tbody td {
      padding: 9px 14px;
      border-bottom: 1px solid #f5f5f5;
      vertical-align: middle;
    }
    tbody td.r { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }

    tfoot td {
      padding: 9px 14px;
      font-weight: 700;
      background: #f8f9ff;
      border-top: 2px solid #e8ecff;
    }
    tfoot td.r { text-align: right; color: #4f6ef7; }

    .ticker { font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace; }

    .badge { display:inline-block; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:12px; }
    .badge-robinhood { background:#fff0e6; color:#d4631a; }
    .badge-us        { background:#e6f0ff; color:#2a5ad4; }
    .badge-kor-stock { background:#e6fff0; color:#1a9450; }
    .badge-kor-etf   { background:#f3e6ff; color:#7b2fd4; }

    .btn-del {
      padding: 4px 10px;
      background: #fff1f0; color: #e03e3e;
      border: 1px solid #ffd6d6;
      border-radius: 6px;
      font-size: 0.76rem; font-weight: 600;
      cursor: pointer;
    }
    .btn-del:hover { background: #ffe0e0; }

    .empty-row td { text-align: center; color: #bbb; padding: 28px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #dc2626; }
  </style>
</head>
<body>

<header>
  <h1>⚙️ 주식 관리</h1>
  <a class="back-btn" href="/">← 대시보드</a>
</header>

<div class="layout">
  <!-- 입력 폼 -->
  <div class="form-card">
    <h2 id="form-title">➕ 종목 추가</h2>

    <div class="field">
      <label>카테고리</label>
      <select id="f-cat" onchange="onCatChange()">
        <option value="robinhood">Robinhood</option>
        <option value="us">US</option>
        <option value="kor-stock">KOR Stock</option>
        <option value="kor-etf">KOR ETF</option>
      </select>
      <div class="cat-quota" id="cat-quota"></div>
    </div>
    <div class="field">
      <label>티커 심볼 *</label>
      <input id="f-ticker" type="text" placeholder="예) AAPL  /  005930.KS" />
    </div>
    <div class="field">
      <label>종목명</label>
      <input id="f-name" type="text" placeholder="예) Apple Inc." />
    </div>
    <div class="field">
      <label>수량</label>
      <input id="f-qty" type="number" step="any" min="0" placeholder="0.0" />
    </div>
    <div class="field">
      <label>평균단가</label>
      <input id="f-avg" type="number" step="any" min="0" placeholder="0.0" />
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="submit()">저장</button>
      <button class="btn btn-secondary" onclick="reset()">초기화</button>
    </div>

    <div class="hint">
      💡 한국 주식 티커: <b>005930.KS</b> (삼성전자)<br>
      💡 한국 ETF 티커: <b>069500.KS</b> (KODEX 200)<br>
      💡 카테고리당 최대 10개
    </div>
  </div>

  <!-- 종목 목록 -->
  <div class="list-card">
    <div class="list-header">
      <h2>종목 목록</h2>
      <div class="filter-tabs">
        <div class="tab active" data-cat="" onclick="filter(this)">전체</div>
        <div class="tab" data-cat="robinhood" onclick="filter(this)">Robinhood</div>
        <div class="tab" data-cat="us" onclick="filter(this)">US</div>
        <div class="tab" data-cat="kor-stock" onclick="filter(this)">KOR Stock</div>
        <div class="tab" data-cat="kor-etf" onclick="filter(this)">KOR ETF</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>카테고리</th>
          <th>티커</th>
          <th>종목명</th>
          <th class="r">수량</th>
          <th class="r">평균단가</th>
          <th class="r">평가금액(단가)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LABEL = { "robinhood":"Robinhood", "us":"US", "kor-stock":"KOR Stock", "kor-etf":"KOR ETF" };
const BADGE = { "robinhood":"badge-robinhood", "us":"badge-us", "kor-stock":"badge-kor-stock", "kor-etf":"badge-kor-etf" };
const CAT_KEYS = ["robinhood","us","kor-stock","kor-etf"];

let all = [], currentCat = "";

const fmtN = v => v != null ? Number(v).toLocaleString("ko-KR", {minimumFractionDigits:2, maximumFractionDigits:4}) : "—";

async function load() {
  all = await fetch("/api/stocks").then(r=>r.json()).catch(()=>[]);
  render();
  updateQuota();
}

function render() {
  const stocks = currentCat ? all.filter(s => s.category === currentCat) : all;
  const tbody = document.getElementById("tbody");
  const tfoot = document.getElementById("tfoot");

  if (!stocks.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">종목이 없습니다</td></tr>`;
    tfoot.innerHTML = "";
    return;
  }

  tbody.innerHTML = stocks.map(s => {
    const val = (s.quantity||0) * Number(s.avg_price||0);
    return `<tr>
      <td><span class="badge ${BADGE[s.category]}">${LABEL[s.category]}</span></td>
      <td><span class="ticker">${s.ticker}</span></td>
      <td>${s.name||"—"}</td>
      <td class="r">${fmtN(s.quantity)}</td>
      <td class="r">${fmtN(s.avg_price)}</td>
      <td class="r">${fmtN(val)}</td>
      <td><button class="btn-del" onclick="del(${s.id})">삭제</button></td>
    </tr>`;
  }).join("");

  const total = stocks.reduce((a,s)=>a+(s.quantity||0)*Number(s.avg_price||0), 0);
  tfoot.innerHTML = `<tr>
    <td colspan="5" class="r" style="font-weight:700">합계 (${stocks.length}개)</td>
    <td class="r">${fmtN(total)}</td>
    <td></td>
  </tr>`;
}

function filter(el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  currentCat = el.dataset.cat;
  render();
}

function updateQuota() {
  const cat = document.getElementById("f-cat").value;
  const cnt = all.filter(s => s.category === cat).length;
  const el  = document.getElementById("cat-quota");
  el.textContent = `현재 ${cnt}/10개 등록됨`;
  el.className = cnt >= 10 ? "cat-quota full" : "cat-quota";
}

function onCatChange() { updateQuota(); }

async function submit() {
  const ticker = document.getElementById("f-ticker").value.trim().toUpperCase();
  if (!ticker) { toast("티커를 입력해 주세요.", true); return; }

  const cat = document.getElementById("f-cat").value;
  const cnt = all.filter(s => s.category === cat).length;
  if (cnt >= 10) { toast("카테고리당 최대 10개까지 등록 가능합니다.", true); return; }

  const body = {
    category:  cat,
    ticker,
    name:      document.getElementById("f-name").value.trim() || null,
    quantity:  parseFloat(document.getElementById("f-qty").value)  || null,
    avg_price: parseFloat(document.getElementById("f-avg").value)  || null,
  };

  const res = await fetch("/api/stocks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  if (res.ok) {
    toast("추가됐습니다. ✓");
    reset();
    load();
  } else {
    const err = await res.json().catch(()=>({detail:"오류"}));
    toast(err.detail || "오류가 발생했습니다.", true);
  }
}

async function del(id) {
  if (!confirm("정말 삭제하시겠습니까?")) return;
  const res = await fetch(`/api/stocks/${id}`, { method: "DELETE" });
  if (res.ok) { toast("삭제됐습니다."); load(); }
  else toast("삭제 실패.", true);
}

function reset() {
  document.getElementById("f-cat").value    = "robinhood";
  document.getElementById("f-ticker").value = "";
  document.getElementById("f-name").value   = "";
  document.getElementById("f-qty").value    = "";
  document.getElementById("f-avg").value    = "";
  updateQuota();
}

function toast(msg, isError=false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className   = "toast show" + (isError ? " error" : "");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = "toast", 2800);
}

load();
</script>
</body>
</html>
