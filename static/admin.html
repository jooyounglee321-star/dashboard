<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header a {
      font-size: 0.85rem;
      color: #4f6ef7;
      text-decoration: none;
      border: 1px solid #4f6ef7;
      padding: 5px 14px;
      border-radius: 6px;
    }
    header a:hover { background: #4f6ef7; color: #fff; }

    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }

    /* ── 입력 폼 ── */
    .form-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      padding: 24px;
      height: fit-content;
      position: sticky;
      top: 24px;
    }
    .form-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 18px; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      margin-bottom: 5px;
    }
    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus, .field select:focus { border-color: #4f6ef7; }

    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #4f6ef7; color: #fff; }
    .btn-secondary { background: #f0f2f5; color: #555; }

    /* ── 종목 목록 ── */
    .list-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      overflow: hidden;
    }

    .list-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
    }
    .list-header h2 { font-size: 1rem; font-weight: 700; }

    .filter-tabs { display: flex; gap: 6px; }
    .tab {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      background: #f0f2f5;
      color: #666;
    }
    .tab.active { background: #4f6ef7; color: #fff; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead th {
      background: #fafafa;
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      color: #666;
      border-bottom: 1px solid #eee;
    }
    thead th.num { text-align: right; }
    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid #f5f5f5;
    }
    tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }

    tfoot td {
      padding: 10px 14px;
      font-weight: 700;
      background: #f8f9ff;
      border-top: 2px solid #e8ecff;
    }
    tfoot td.num { text-align: right; color: #4f6ef7; }

    .btn-del {
      padding: 4px 10px;
      background: #fff1f0;
      color: #e03e3e;
      border: 1px solid #ffd6d6;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-del:hover { background: #ffe0e0; }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-robinhood { background: #fff0e6; color: #d4631a; }
    .badge-us        { background: #e6f0ff; color: #2a5ad4; }
    .badge-kor-stock { background: #e6fff0; color: #1a9450; }
    .badge-kor-etf   { background: #f3e6ff; color: #7b2fd4; }

    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .empty-row td { text-align: center; color: #aaa; padding: 24px; }
  </style>
</head>
<body>

<header>
  <h1>⚙️ 주식 관리</h1>
  <a href="/">← 대시보드</a>
</header>

<div class="layout">
  <!-- 입력 폼 -->
  <div class="form-card">
    <h2 id="form-title">➕ 종목 추가</h2>
    <input type="hidden" id="edit-id" />

    <div class="field">
      <label>카테고리</label>
      <select id="f-category">
        <option value="robinhood">Robinhood</option>
        <option value="us">US</option>
        <option value="kor-stock">KOR Stock</option>
        <option value="kor-etf">KOR ETF</option>
      </select>
    </div>
    <div class="field">
      <label>티커 *</label>
      <input id="f-ticker" type="text" placeholder="예) AAPL" />
    </div>
    <div class="field">
      <label>종목명</label>
      <input id="f-name" type="text" placeholder="예) Apple Inc." />
    </div>
    <div class="field">
      <label>수량</label>
      <input id="f-quantity" type="number" step="any" placeholder="0.00" />
    </div>
    <div class="field">
      <label>평균단가</label>
      <input id="f-avg-price" type="number" step="any" placeholder="0.00" />
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="submitForm()">저장</button>
      <button class="btn btn-secondary" onclick="resetForm()">초기화</button>
    </div>
  </div>

  <!-- 종목 목록 -->
  <div class="list-card">
    <div class="list-header">
      <h2>종목 목록</h2>
      <div class="filter-tabs">
        <div class="tab active" onclick="filterBy(null, this)">전체</div>
        <div class="tab" onclick="filterBy('robinhood', this)">Robinhood</div>
        <div class="tab" onclick="filterBy('us', this)">US</div>
        <div class="tab" onclick="filterBy('kor-stock', this)">KOR Stock</div>
        <div class="tab" onclick="filterBy('kor-etf', this)">KOR ETF</div>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>카테고리</th>
          <th>티커</th>
          <th>종목명</th>
          <th class="num">수량</th>
          <th class="num">평균단가</th>
          <th class="num">평가금액</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="stock-tbody"></tbody>
      <tfoot id="stock-tfoot"></tfoot>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const LABEL = {
    "robinhood": "Robinhood",
    "us":        "US",
    "kor-stock": "KOR Stock",
    "kor-etf":   "KOR ETF",
  };
  const BADGE = {
    "robinhood": "badge-robinhood",
    "us":        "badge-us",
    "kor-stock": "badge-kor-stock",
    "kor-etf":   "badge-kor-etf",
  };

  const fmt = (n) => Number(n).toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let allStocks = [];
  let currentFilter = null;

  async function load() {
    const res = await fetch('/api/stocks');
    allStocks  = await res.json();
    renderTable();
  }

  function renderTable() {
    const stocks = currentFilter
      ? allStocks.filter(s => s.category === currentFilter)
      : allStocks;

    const tbody = document.getElementById('stock-tbody');
    const tfoot = document.getElementById('stock-tfoot');

    if (!stocks.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="7">종목이 없습니다</td></tr>';
      tfoot.innerHTML = '';
      return;
    }

    tbody.innerHTML = stocks.map(s => {
      const total = (s.quantity || 0) * (s.avg_price || 0);
      return `<tr>
        <td><span class="badge ${BADGE[s.category]}">${LABEL[s.category] || s.category}</span></td>
        <td><strong>${s.ticker}</strong></td>
        <td>${s.name || '—'}</td>
        <td class="num">${s.quantity != null ? fmt(s.quantity) : '—'}</td>
        <td class="num">${s.avg_price != null ? fmt(s.avg_price) : '—'}</td>
        <td class="num">${fmt(total)}</td>
        <td><button class="btn-del" onclick="deleteStock(${s.id})">삭제</button></td>
      </tr>`;
    }).join('');

    const grandTotal = stocks.reduce((a, s) => a + (s.quantity || 0) * (s.avg_price || 0), 0);
    tfoot.innerHTML = `<tr>
      <td colspan="5">합계 (${stocks.length}개 종목)</td>
      <td class="num">${fmt(grandTotal)}</td>
      <td></td>
    </tr>`;
  }

  function filterBy(cat, el) {
    currentFilter = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderTable();
  }

  async function submitForm() {
    const ticker = document.getElementById('f-ticker').value.trim();
    if (!ticker) { showToast('티커를 입력하세요'); return; }

    const payload = {
      category:  document.getElementById('f-category').value,
      ticker:    ticker.toUpperCase(),
      name:      document.getElementById('f-name').value.trim() || null,
      quantity:  parseFloat(document.getElementById('f-quantity').value) || null,
      avg_price: parseFloat(document.getElementById('f-avg-price').value) || null,
    };

    const editId = document.getElementById('edit-id').value;
    const url    = editId ? `/api/stocks/${editId}` : '/api/stocks';
    const method = editId ? 'PUT' : 'POST';

    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (res.ok) {
      showToast(editId ? '수정됐습니다' : '추가됐습니다');
      resetForm();
      load();
    } else {
      showToast('오류가 발생했습니다');
    }
  }

  async function deleteStock(id) {
    if (!confirm('삭제하시겠습니까?')) return;
    const res = await fetch(`/api/stocks/${id}`, { method: 'DELETE' });
    if (res.ok) { showToast('삭제됐습니다'); load(); }
  }

  function resetForm() {
    document.getElementById('edit-id').value   = '';
    document.getElementById('f-category').value = 'robinhood';
    document.getElementById('f-ticker').value   = '';
    document.getElementById('f-name').value     = '';
    document.getElementById('f-quantity').value = '';
    document.getElementById('f-avg-price').value = '';
    document.getElementById('form-title').textContent = '➕ 종목 추가';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  load();
</script>
</body>
</html>
